# Object storage (data plane) — deployed as its own stack in production (separate from Airflow).
# Locally, merge with the orchestration compose so workers use http://minio:9000.
#
#   docker compose -f airflow/docker-compose.yaml -f minio/docker-compose.objectstore.yaml up -d
#
# Object store only:
#   docker compose -f minio/docker-compose.objectstore.yaml up -d
#
# Pinned images for reproducibility. Use long random values for keys in any shared environment.

---
networks:
  default:
    name: taxi_minio_platform

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Bootstrap: buckets + application IAM-style user (not root) — pattern used with real S3 too.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PIPELINE_ACCESS_KEY: ${MINIO_PIPELINE_ACCESS_KEY:?Set MINIO_PIPELINE_ACCESS_KEY in .env}
      MINIO_PIPELINE_SECRET_KEY: ${MINIO_PIPELINE_SECRET_KEY:?Set MINIO_PIPELINE_SECRET_KEY in .env}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-taxi-raw}
      MINIO_BUCKET_ML: ${MINIO_BUCKET_ML:-ml-artifacts}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_RAW"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_ML"
        mc admin user add local "$$MINIO_PIPELINE_ACCESS_KEY" "$$MINIO_PIPELINE_SECRET_KEY" 2>/dev/null || true
        mc admin policy attach local readwrite --user "$$MINIO_PIPELINE_ACCESS_KEY" 2>/dev/null || true
        echo "MinIO bootstrap: buckets ready; pipeline S3 keys = MINIO_PIPELINE_* (not root)."
    restart: "no"

volumes:
  minio-data:
