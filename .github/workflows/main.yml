name: Train Taxi Demand Model

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Reuse processed/ across runs when only train.py (or other non-data code) changes.
      # Key changes when raw window files or preprocess logic changes → cache miss → rebuild.
      - name: Restore processed features cache
        uses: actions/cache@v4
        with:
          path: processed/
          key: features-${{ hashFiles('windowData/**', 'src/preprocess.py') }}

      - name: Build features (skip if fingerprint matches)
        run: python src/preprocess.py

      - name: Train model
        run: python src/train.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxi-demand-model
          path: models/
